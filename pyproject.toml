[project]
name = "canary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "langchain-core>=1.3.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint>=4.0.3",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[project.scripts]
canary = "canary.main:main"
